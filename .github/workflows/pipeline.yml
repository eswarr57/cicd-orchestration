
name: Multi-Stage CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Stage 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile-check application
        run: python -m compileall -q app tests

  test:
    name: Stage 2 - Automated Testing
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore

  package:
    name: Stage 3 - Package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create versioned application package
        shell: bash
        run: |
          mkdir -p dist
          VERSION="0.1.0-${GITHUB_SHA::7}"
          git archive --format=zip \
            --prefix="cicd-orchestration-${VERSION}/" \
            -o "dist/cicd-orchestration-${VERSION}.zip" HEAD
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-orchestration-${{ env.PACKAGE_VERSION }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
