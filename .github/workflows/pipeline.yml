
name: Multi-Stage CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Stage 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile-check application
        run: python -m compileall -q app tests

  
  docker_build:
    name: Stage 4 - Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cicd-orchestration:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cicd-orchestration:latest

  staging:
    name: Stage 6 - Staging Deployment and Smoke Tests
    runs-on: ubuntu-latest
    needs: docker_build
    if: github.event_name != 'pull_request'

    steps:
      - name: Pull published Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/cicd-orchestration:${{ github.sha }}

      - name: Deploy staging container
        run: |
          docker run -d \
            --name cicd-staging \
            -p 5001:5000 \
            ghcr.io/${{ github.repository_owner }}/cicd-orchestration:${{ github.sha }}

      - name: Wait for application readiness
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/health; then
              echo "Staging health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Staging health check failed"
          docker logs cicd-staging
          exit 1

      - name: Run staging smoke tests
        run: |
          curl --fail --silent http://localhost:5001/ > /dev/null
          curl --fail --silent http://localhost:5001/pipeline
          echo "Staging smoke tests passed"

      - name: Clean up staging container
        if: always()
        run: docker rm -f cicd-staging || true

  production:
    name: Stage 7 - Production Release
    runs-on: ubuntu-latest
    needs: staging
    if: github.event_name != 'pull_request'
    environment:
      name: production
    concurrency:
      group: production-release
      cancel-in-progress: false

    steps:
      - name: Pull the image verified by staging
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/cicd-orchestration:${{ github.sha }}

      - name: Deploy production container
        run: |
          docker run -d \
            --name cicd-production \
            -p 5002:5000 \
            ghcr.io/${{ github.repository_owner }}/cicd-orchestration:${{ github.sha }}

      - name: Verify production health
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5002/health; then
              echo "Production health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Production health check failed"
          docker logs cicd-production
          exit 1

      - name: Run production smoke tests
        run: |
          curl --fail --silent http://localhost:5002/ > /dev/null
          curl --fail --silent http://localhost:5002/pipeline
          echo "Production smoke tests passed"

      - name: Clean up production container
        if: always()
        run: docker rm -f cicd-production || true



  test:
    name: Stage 2 - Automated Testing
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore

  package:
    name: Stage 3 - Package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create versioned application package
        shell: bash
        run: |
          mkdir -p dist
          VERSION="0.1.0-${GITHUB_SHA::7}"
          git archive --format=zip \
            --prefix="cicd-orchestration-${VERSION}/" \
            -o "dist/cicd-orchestration-${VERSION}.zip" HEAD
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-orchestration-${{ env.PACKAGE_VERSION }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
